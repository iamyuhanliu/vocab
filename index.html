<title>我的词汇本</title>

<style>
:root {
  /* 布局：顶部进度 + 一张居中的单词卡，像一叠复习卡片；列表模式是可扫读的词表 */
  --paper: #f3f5fa;
  --card: #ffffff;
  --ink: #151a2e;
  --muted: #5f6782;
  --line: #dde2ee;
  --accent: #2c46e8;
  --accent-ink: #ffffff;
  --mark: #ffe25a;
  --ok: #148a5c;
  --soft: #e9edfb;
  --font-display: "Bricolage Grotesque", "Noto Sans SC", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1120;
    --card: #171b2f;
    --ink: #eef0f9;
    --muted: #9ba3c2;
    --line: #2a3050;
    --accent: #8c9dff;
    --accent-ink: #0e1120;
    --mark: #e8c93a;
    --ok: #4cc79a;
    --soft: #20264a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1120;
  --card: #171b2f;
  --ink: #eef0f9;
  --muted: #9ba3c2;
  --line: #2a3050;
  --accent: #8c9dff;
  --accent-ink: #0e1120;
  --mark: #e8c93a;
  --ok: #4cc79a;
  --soft: #20264a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px 16px 28px;
}

header { display: flex; flex-direction: column; gap: 10px; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .3s ease; }

.tabs { display: flex; gap: 4px; background: var(--line); padding: 4px; border-radius: 12px; }
.tabs button {
  flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px;
  font-weight: 600; font-size: 15px; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls select {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 7px 30px 7px 10px; font-size: 14px; max-width: 100%;
}
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 99px;
  padding: 6px 12px; font-size: 14px; color: var(--muted); white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--soft); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.books { display: flex; width: 100%; border-radius: 12px; }
.books button { flex: 1; padding: 9px 12px; font-size: 15px; }

/* 卡片 */
.study { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.meta-line { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 330px;
  box-shadow: 0 6px 24px rgba(20, 26, 60, .06);
}
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.tag.pos { font-family: var(--font-body); font-style: italic; }
.front { display: flex; align-items: center; gap: 14px; justify-content: space-between; }
.word {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 8vw, 46px);
  line-height: 1.1; margin: 0; overflow-wrap: anywhere; text-wrap: balance;
}
.word.zh { font-family: "Noto Sans SC", var(--font-body); font-size: clamp(26px, 7vw, 38px); }
.speak {
  flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
}
.speak.small { width: 36px; height: 36px; }
.speak svg { width: 26px; height: 26px; }
.speak.small svg { width: 18px; height: 18px; }
.speak.playing { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.92); opacity: .8; } }

.answer { display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed var(--line); padding-top: 16px; }
.answer[hidden] { display: none; }
.zh-main { font-size: 22px; font-weight: 600; }
.zh-main mark { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 2px; }
.note { color: var(--muted); font-size: 15px; }
.example { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border-radius: 12px; padding: 10px 12px; }
.example p { margin: 0; font-size: 15px; font-style: italic; }
.reveal-hint { color: var(--muted); font-size: 14px; margin-top: auto; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions button {
  border-radius: 14px; padding: 14px 10px; font-size: 16px; font-weight: 600; border: 1px solid var(--line);
  background: var(--card);
}
.actions .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.actions .known { background: var(--ok); color: #fff; border-color: var(--ok); }
.actions .full { grid-column: 1 / -1; }
.kbd { color: var(--muted); font-size: 12px; text-align: center; }
@media (hover: none) { .kbd { display: none; } }

.done { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 40px 10px; }
.done h2 { font-family: var(--font-display); margin: 0; font-size: 24px; }
.done p { margin: 0; color: var(--muted); }

/* 列表 */
.list-view { display: flex; flex-direction: column; gap: 10px; }
.search { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; width: 100%; font-size: 15px; }
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--card); }
.row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.is-known .en { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--ok); }
.row .en { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.row .pos { color: var(--muted); font-style: italic; font-size: 13px; margin-left: 6px; font-weight: 400; }
.row .zh { font-size: 14px; color: var(--muted); }
.row .zh.hidden-zh { background: var(--line); color: transparent; border-radius: 6px; cursor: pointer; user-select: none; display: inline-block; min-width: 6em; }
.tick {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; color: transparent;
}
.tick[aria-pressed="true"] { border-color: var(--ok); background: var(--ok); color: #fff; }
.tick svg { width: 16px; height: 16px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

.status { font-size: 13px; color: var(--muted); text-align: center; min-height: 1.4em; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px;
  max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

/* ---------- 保存进度 ---------- */
let db = null, uid = null, saving = Promise.resolve(), saveTimer = null;
const LS_KEY = "vocab-known-v1";
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) JSON.parse(raw).forEach(k => state.known.add(k)); } catch (e) {}
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify([...state.known])); } catch (e) {}
}
function scheduleSave() {
  saveLocal();
  if (!db || !uid) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { known: [...state.known], updatedAt: new Date().toISOString() };
    saving = saving.then(() => db.doc("data/users/" + uid + "/progress").set(body))
      .then(() => setStatus("进度已同步，换设备打开也在"))
      .catch(() => setStatus("这次没同步上，进度先存在这台设备上"));
  }, 500);
}
function setStatus(t) { $("status").textContent = t; }

async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    const timer = setTimeout(() => setStatus("云端进度暂时连不上，先用这台设备上的"), 10000);
    const snap = await db.doc("data/users/" + uid + "/progress").get();
    clearTimeout(timer);
    if (snap.exists) {
      const data = snap.data() || {};
      (data.known || []).forEach(k => state.known.add(k));
      if (state.known.size > (data.known || []).length) scheduleSave();
    } else if (state.known.size) {
      scheduleSave();
    }
    setStatus("进度已同步，换设备打开也在");
    rebuildQueue(true);
    render();
  } catch (e) {
    setStatus("云端进度暂时连不上，先用这台设备上的");
  }
}

/* ---------- 发音 ---------- */
let tts = null, voices = [];
function refreshVoices() { try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { voices = []; } }
if (window.speechSynthesis) { refreshVoices(); speechSynthesis.onvoiceschanged = refreshVoices; }
if (window.claude && window.claude.use) { window.claude.use("tts").then(t => { tts = t; }).catch(() => {}); }

function speechText(s) {
  return s.replace(/（[^）]*）/g, "").replace(/\s*\([^)]*\)/g, "").replace(/\s+(sth|sb)\b/g, "").trim();
}
function pickVoice() {
  const lang = state.accent === "uk" ? "en-GB" : "en-US";
  const pool = voices.filter(v => (v.lang || "").replace("_", "-").toLowerCase() === lang.toLowerCase());
  if (!pool.length) return null;
  const prefer = state.accent === "uk"
    ? ["Google UK English Female", "Google UK English Male", "Serena", "Daniel", "Kate", "Martha", "Arthur", "Microsoft Sonia", "Microsoft Libby"]
    : ["Google US English", "Samantha", "Ava", "Allison", "Microsoft Aria", "Microsoft Jenny", "Alex"];
  for (const name of prefer) { const v = pool.find(v => v.name.includes(name)); if (v) return v; }
  return pool[0];
}
let speakingBtn = null;
function markSpeaking(btn, on) {
  if (speakingBtn && speakingBtn !== btn) speakingBtn.classList.remove("playing");
  speakingBtn = on ? btn : null;
  if (btn) btn.classList.toggle("playing", on);
}
function speak(raw, btn) {
  const text = speechText(raw);
  if (!text) return;
  if (window.speechSynthesis && typeof SpeechSynthesisUtterance !== "undefined") {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = state.accent === "uk" ? "en-GB" : "en-US";
      const v = pickVoice(); if (v) u.voice = v;
      u.rate = 0.9;
      u.onstart = () => markSpeaking(btn, true);
      u.onend = u.onerror = () => markSpeaking(btn, false);
      speechSynthesis.speak(u);
      return;
    } catch (e) {}
  }
  if (tts) {
    markSpeaking(btn, true);
    tts.speak(text, { language: "en", rate: 0.9 }).catch(() => {}).finally(() => markSpeaking(btn, false));
    return;
  }
  toast("这个浏览器没有英文发音，换 Chrome 或 Safari 打开试试");
}

let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- 牌组 ---------- */
function scopeTest() { return (SCOPES.find(s => s.id === state.scope) || SCOPES[0]).test; }
function inScope() { const t = scopeTest(); return WORDS.filter(w => w.book === state.book && t(w)); }
function rebuildQueue(keepCurrent) {
  const current = state.queue[state.pos];
  let list = inScope();
  if (state.onlyNew) list = list.filter(w => !state.known.has(w.id));
  if (state.shuffle) {
    list = list.slice();
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  }
  state.queue = list;
  state.pos = 0;
  if (keepCurrent && current) { const i = list.indexOf(current); if (i >= 0) state.pos = i; }
  state.revealed = false;
}

    el.innerHTML = '<div class="card"><div class="done">' +
      '<h2>这一组背完了</h2>' +

      '</div></div>';
    const r = $("restart");
    if (r) r.onclick = () => { state.onlyNew = false; rebuildQueue(); render(); };
    return;
  }
  const front = state.zhFirst
    ? '<p class="word zh">' + esc(w.zh) + '</p>'
    : '<p class="word" lang="en">' + esc(w.en) + '</p>';
  const speakFront = state.zhFirst ? "" : '<button class="speak" id="say" aria-label="播放发音">' + ICON_SPEAK + '</button>';
  const answerTop = state.zhFirst
    ? '<div class="front"><p class="word" lang="en" style="font-size:clamp(26px,7vw,38px)">' + esc(w.en) + '</p><button class="speak" id="say" aria-label="播放发音">' + ICON_SPEAK + '</button></div>'
    : '<div class="zh-main"><mark>' + esc(w.zh) + '</mark></div>';
  const ex = w.ex ? '<div class="example"><button class="speak small" id="say-ex" aria-label="播放原句">' + ICON_SPEAK + '</button><p lang="en">' + esc(w.ex) + '</p></div>' : "";
  const note = w.note ? '<div class="note">' + esc(w.note) + '</div>' : "";
  const known = state.known.has(w.id);

  el.innerHTML =
    '<div class="meta-line"><span>第 ' + (state.pos + 1) + ' / ' + state.queue.length + ' 张</span><span>' + (known ? "已记住" : "") + '</span></div>' +
    '<div class="card" id="card">' +
      '<div class="tags"><span class="tag">' + esc(w.type) + '</span>' + (w.pos ? '<span class="tag pos">' + esc(w.pos) + '</span>' : "") + '</div>' +
      '<div class="front">' + front + speakFront + '</div>' +
      '<div class="answer" id="answer"' + (state.revealed ? "" : " hidden") + '>' + answerTop + note + ex + '</div>' +
      (state.revealed ? "" : '<div class="reveal-hint">先在心里想一下意思，再点「看答案」</div>') +
    '</div>' +
    '<div class="actions">' +
      (state.revealed
        ? '<button id="again">还不熟</button><button class="known" id="got">记住了</button>'
        : '<button class="primary full" id="show">看答案</button>') +
    '</div>' +
    '<div class="kbd">空格 看答案 · ← 还不熟 · → 记住了 · P 发音</div>';

  const say = $("say"); if (say) say.onclick = e => { e.stopPropagation(); speak(w.en, say); };
  const sayEx = $("say-ex"); if (sayEx) sayEx.onclick = e => { e.stopPropagation(); speak(w.ex, sayEx); };
  const show = $("show"); if (show) show.onclick = reveal;
  const again = $("again"); if (again) again.onclick = notYet;
  const got = $("got"); if (got) got.onclick = gotIt;
}

function renderList() {
  const q = $("search").value.trim().toLowerCase();
  let list = inScope();
  if (q) list = list.filter(w => w.en.toLowerCase().includes(q) || w.zh.includes(q));
  if (!list.length) { $("rows").innerHTML = '<div class="empty">没有找到这个词</div>'; return; }
  $("rows").innerHTML = list.map((w, i) => {
    const k = state.known.has(w.id);
    return '<div class="row' + (k ? " is-known" : "") + '">' +
      '<button class="speak small" data-say="' + i + '" aria-label="播放 ' + esc(w.en) + '">' + ICON_SPEAK + '</button>' +
      '<div><div class="en" lang="en">' + esc(w.en) + (w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : "") + '</div>' +
      '<div class="zh' + (state.hideZh ? " hidden-zh" : "") + '" data-zh>' + esc(w.zh) + '</div></div>' +
      '<button class="tick" data-tick="' + i + '" aria-pressed="' + k + '" aria-label="' + (k ? "取消记住" : "标记记住了") + '">' + ICON_TICK + '</button>' +
    '</div>';
  }).join("");
  $("rows").querySelectorAll("[data-say]").forEach(b => b.onclick = () => speak(list[+b.dataset.say].en, b));
  $("rows").querySelectorAll("[data-tick]").forEach(b => b.onclick = () => {
    const w = list[+b.dataset.tick];
    if (state.known.has(w.id)) state.known.delete(w.id); else state.known.add(w.id);
    scheduleSave(); renderHeader(); renderList();
  });
  $("rows").querySelectorAll("[data-zh]").forEach(z => z.onclick = () => z.classList.remove("hidden-zh"));
}

function render() {
  renderHeader();
  if (state.view === "cards") renderCard(); else renderList();
}

/* ---------- 操作 ---------- */
function autoSpeakCurrent() {
  const w = state.queue[state.pos];
  if (!w || !state.auto || !state.interacted) return;
  if (state.zhFirst && !state.revealed) return;
  speak(w.en, $("say"));
}
function reveal() {
  state.interacted = true;
  state.revealed = true;
  renderCard();
  if (state.zhFirst) autoSpeakCurrent();
}
function next() {
  state.revealed = false;
  if (state.pos >= state.queue.length) state.pos = 0;
  render();
  if (!state.zhFirst) autoSpeakCurrent();
}
function notYet() {
  state.interacted = true;
  const w = state.queue.splice(state.pos, 1)[0];
  const at = Math.min(state.queue.length, state.pos + 5);
  state.queue.splice(at, 0, w);
  if (at === state.pos) state.pos = 0;
  next();
}
function gotIt() {
  state.interacted = true;
  const w = state.queue[state.pos];
  state.known.add(w.id);
  scheduleSave();
  if (state.onlyNew) state.queue.splice(state.pos, 1); else state.pos++;
  if (!state.onlyNew && state.pos >= state.queue.length) state.pos = state.queue.length;
  next();
}

/* ---------- 绑定 ---------- */
function fillScopes() {
  $("scope").innerHTML = SCOPES.filter(s => s.book === state.book).map(s => '<option value="' + s.id + '">' + esc(s.label) + '</option>').join("");
  $("scope").value = state.scope;
}
function switchBook(b) {
  if (state.book === b) return;
  state.book = b; state.scope = firstScope(b);
  try { localStorage.setItem("vocab-book", b); } catch (e) {}
  $("search").value = "";
  fillScopes(); rebuildQueue(); render();
}
fillScopes();
$("book-ceping").onclick = () => switchBook("ceping");
$("book-retail").onclick = () => switchBook("retail");
$("scope").onchange = e => { state.scope = e.target.value; rebuildQueue(); render(); };
$("only-new").onclick = () => { state.onlyNew = !state.onlyNew; rebuildQueue(); render(); };
$("acc-uk").onclick = () => { state.accent = "uk"; state.interacted = true; renderHeader(); const w = state.queue[state.pos]; if (state.view === "cards" && w) speak(w.en, $("say")); };
$("acc-us").onclick = () => { state.accent = "us"; state.interacted = true; renderHeader(); const w = state.queue[state.pos]; if (state.view === "cards" && w) speak(w.en, $("say")); };
$("auto").onclick = () => { state.auto = !state.auto; renderHeader(); };
$("zh-first").onclick = () => { state.zhFirst = !state.zhFirst; state.revealed = false; render(); };
$("shuffle").onclick = () => { state.shuffle = !state.shuffle; rebuildQueue(); render(); };
$("hide-zh").onclick = () => { state.hideZh = !state.hideZh; renderHeader(); renderList(); };
$("search").oninput = renderList;
$("tab-cards").onclick = () => { state.view = "cards"; rebuildQueue(true); render(); };
$("tab-list").onclick = () => { state.view = "list"; render(); };

document.addEventListener("keydown", e => {
  if (state.view !== "cards" || e.target.matches("input, select, textarea")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!state.revealed) reveal(); }
  else if (e.key === "ArrowLeft" && state.revealed) notYet();
  else if (e.key === "ArrowRight" && state.revealed) gotIt();
  else if (e.key.toLowerCase() === "p") { const w = state.queue[state.pos]; if (w) { state.interacted = true; speak(w.en, $("say")); } }
});

loadLocal();
rebuildQueue();
render();
initCloud();
</script>
</body>
</html>
